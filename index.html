<title>Marika Dunne</title>
<meta name="description" content="Marika Dunne is a Mississippi artist working in painting, drawing, printmaking, and photography.">
<link rel="canonical" href="https://marikadunne.com/">

<style>
  :root {
    /* Dark mode (default): Design A on a black background */
    --bg: #0f0f0e;
    --ink: #ece7df;
    --muted: #a39d93;
    --line: #2d2c28;
    --select: #3a3833;
    --shadow-piece: none;
    --shadow-cell: none;
    --shadow-cover: none;
    color-scheme: dark;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Jost", system-ui, sans-serif;
  }
  /* Light mode: Design A's warm white gallery walls */
  :root[data-theme="light"] {
    --bg: #f6f4ef;
    --ink: #1c1b19;
    --muted: #6f6a62;
    --line: #e3dfd7;
    --select: #e6e0d4;
    --shadow-piece: 0 1px 2px rgba(40, 34, 24, 0.06), 0 22px 44px -28px rgba(40, 34, 24, 0.35);
    --shadow-cell: 0 14px 28px -20px rgba(40, 34, 24, 0.4);
    --shadow-cover: 0 22px 44px -28px rgba(40, 34, 24, 0.4);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); transition: background-color 0.4s ease; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    transition: background-color 0.4s ease, color 0.4s ease;
    font: 400 20.5px/1.65 var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main { flex: 1; }
  .mail, .cv-title, .cv-venue { font-variant-numeric: lining-nums; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  img { max-width: 100%; }
  ::selection { background: var(--select); color: var(--ink); }

  /* small caps label used throughout */
  .label, .nav, .views, .cv-year, .cv-juried, .piece .m, .cell .m, footer, .dl {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* ---------- Masthead ---------- */
  .masthead { padding: 44px 16px 0; text-align: center; }
  .seal { display: block; width: 70px; margin: 0 auto 20px; transition: opacity 0.3s; }
  .seal:hover { opacity: 0.7; }
  .seal img { display: block; width: 100%; height: auto; }
  .seal .for-light { display: none; }
  :root[data-theme="light"] .seal .for-light { display: block; }
  :root[data-theme="light"] .seal .for-dark { display: none; }

  /* Light / Dark switch, top right */
  .masthead { position: relative; }
  .theme {
    position: absolute; top: 22px; right: 24px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: none; color: var(--muted); cursor: pointer;
    font-family: var(--sans); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    transition: color 0.25s, border-color 0.25s;
  }
  .theme:hover, .theme:focus-visible { color: var(--ink); border-color: var(--muted); outline: none; }
  .theme svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  /* the switch shows the current mode: moon + Night when dark, sun + Day when light */
  .theme .sun { display: none; }
  :root[data-theme="light"] .theme .moon { display: none; }
  :root[data-theme="light"] .theme .sun { display: block; }
  .name {
    margin: 0;
    font-weight: 400;
    font-size: clamp(26px, 4.6vw, 54px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .name a { text-decoration: none; }
  .nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 36px; margin-top: 24px; font-size: 13.5px; }
  .nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 6px 0 4px;
    border-bottom: 1px solid transparent;
    transition: color 0.25s, border-color 0.25s;
  }
  .nav a:hover { color: var(--ink); }
  .nav a.is-active { color: var(--ink); border-color: var(--ink); }

  [data-page] { animation: fade 0.6s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Work: view switch ---------- */
  .views { display: flex; justify-content: center; gap: 22px; margin: 40px 0 0; color: var(--muted); }
  .views button {
    background: none; border: 0; padding: 4px 0; cursor: pointer;
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--muted);
    border-bottom: 1px solid transparent;
  }
  .views button[aria-pressed="true"] { color: var(--ink); border-color: var(--line); }
  .views button:hover { color: var(--ink); }

  /* ---------- Work: one per row ---------- */
  .wall {
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(110px, 18vh, 190px);
    padding: 44px 16px 140px;
  }
  .piece { margin: 0; display: flex; flex-direction: column; align-items: center; max-width: 100%; }
  .frame {
    display: block; padding: 0; border: 0; background: none; cursor: zoom-in; max-width: 100%;
  }
  .frame img {
    box-shadow: var(--shadow-piece);
    display: block;
    width: auto; height: auto;
    max-width: min(100%, 1040px);
    /* each piece fits on screen together with its caption */
    max-height: max(420px, calc(100vh - 190px));
  }
  /* the header above the first piece is ~320px tall: keep piece + caption on screen */
  /* tall, narrow pieces are limited by height, so give them more of it (caption still fits) */
  .piece.tall .frame img { max-height: max(460px, calc(100vh - 135px)); }
  .piece:first-child .frame img { max-height: max(340px, calc(100vh - 470px)); }
  .frame:focus-visible { outline: 1px solid var(--ink); outline-offset: 8px; }
  .piece figcaption { margin-top: 26px; text-align: center; }
  .piece .t { display: block; font-style: italic; font-size: 25px; line-height: 1.3; }
  .piece .m { display: block; margin-top: 6px; color: var(--muted); }
  .tbd { opacity: 0.6; }

  .piece { opacity: 0; transform: translateY(18px); transition: opacity 1.1s ease, transform 1.1s ease; }
  .piece.is-in { opacity: 1; transform: none; }

  /* ---------- Work: index grid ---------- */
  .index {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 64px 44px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 72px 24px 140px;
  }
  .cell { display: flex; flex-direction: column; text-decoration: none; cursor: zoom-in; }
  .cell .box { aspect-ratio: 1; display: flex; align-items: flex-end; justify-content: center; }
  .cell img {
    display: block; width: auto; height: auto; max-width: 100%; max-height: 100%;
    transition: transform 0.5s ease;
   box-shadow: var(--shadow-cell); }
  .cell:hover img { transform: translateY(-3px); }
  .cell .t { margin-top: 16px; font-style: italic; font-size: 20px; text-align: center; line-height: 1.3; }
  .cell .m { margin-top: 4px; color: var(--muted); text-align: center; font-size: 11px; }

  /* ---------- Link to the other collection (bottom of Recent / Past) ---------- */
  .next {
    display: flex; flex-direction: column; align-items: center; gap: 0;
    width: min(400px, calc(100% - 32px)); margin: 0 auto 120px; text-decoration: none;
  }
  .next::before { content: ""; width: 40px; height: 1px; background: var(--muted); opacity: 0.5; margin-bottom: 64px; }
  .next .k { font-family: var(--sans); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 26px; }
  .next .cover { display: block; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; transition: transform 0.6s ease;  box-shadow: var(--shadow-cover); }
  .next .cover-img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--focus); transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .next .t { margin-top: 24px; font-style: italic; font-size: 32px; line-height: 1.2; }
  .next .m { margin-top: 6px; font-family: var(--sans); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .next .arrow { display: inline-block; margin-left: 8px; transition: transform 0.4s ease; }
  .next:hover .cover, .next:focus-visible .cover { transform: translateY(-4px); }
  .next:hover .cover-img { transform: scale(1.03); }
  .next:hover .arrow, .next:focus-visible .arrow { transform: translateX(6px); }
  .next:focus-visible { outline: none; }
  .next:focus-visible .t { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
  .wall, .index { padding-bottom: 96px; }

  /* ---------- Text pages ---------- */
  .page { max-width: 660px; margin: 0 auto; padding: 88px 16px 140px; }
  .label { display: block; color: var(--muted); text-align: center; margin: 0 0 36px; }
  .lead {
    font-size: clamp(26px, 2.8vw, 33px);
    line-height: 1.38;
    font-style: italic;
    font-weight: 400;
    text-align: center;
    text-wrap: balance;
    margin: 0 0 44px;
  }
  .prose p { margin: 0 0 1.1em; }
  .portrait { margin: 0 auto 64px; width: min(300px, 70%); }
  .portrait img {
    display: block; width: 100%; height: auto;
   box-shadow: var(--shadow-piece); }
  .rule { width: 40px; height: 1px; background: var(--muted); opacity: 0.5; border: 0; margin: 80px auto; }

  /* ---------- CV ---------- */
  .cv-wrap { max-width: 780px; }
  .dl {
    display: block; width: max-content; margin: 0 auto 64px; color: var(--ink); text-decoration: none;
    border-bottom: 1px solid var(--line); padding-bottom: 4px;
  }
  .dl:hover { border-color: var(--ink); }
  .cv-section { margin: 0 0 56px; }
  .cv-h {
    margin: 0 0 18px; font-weight: 400; font-size: 27px; font-style: italic;
    padding-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .cv-list { list-style: none; margin: 0; padding: 0; }
  .cv-row { display: grid; grid-template-columns: 96px 1fr auto; gap: 0 20px; padding: 7px 0; align-items: baseline; }
  .cv-year { color: var(--muted); font-size: 12px; letter-spacing: 0.12em; }
  .cv-title { font-size: 20px; line-height: 1.4; }
  .cv-venue { display: block; color: var(--muted); font-size: 17.5px; line-height: 1.4; }
  .cv-juried { color: var(--muted); font-size: 11px; }

  /* ---------- Contact ---------- */
  .contact { text-align: center; }
  .contact .lead { margin-bottom: 30px; }
  .mail {
    display: inline-block; font-size: clamp(26px, 3.8vw, 42px); text-decoration: none;
    border-bottom: 1px solid var(--line); padding-bottom: 2px; transition: border-color 0.25s;
    overflow-wrap: anywhere;
  }
  .mail:hover { border-color: var(--ink); }
  .contact .small { margin-top: 44px; color: var(--muted); font-size: 18.5px; }

  /* Instagram: a quiet line under the email; the underline draws out from the center */
  .follow { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .follow::before { content: ""; width: 40px; height: 1px; background: var(--muted); opacity: 0.5; margin: 52px 0 26px; }
  .follow .k { font-family: var(--sans); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .ig {
    display: inline-flex; align-items: center; gap: 12px;
    font-style: italic; font-size: clamp(24px, 2.6vw, 30px); text-decoration: none;
    font-variant-numeric: lining-nums; padding-bottom: 3px;
    background: linear-gradient(currentColor, currentColor) 50% 100% / 0 1px no-repeat;
    transition: background-size 0.45s ease;
  }
  .ig:hover, .ig:focus-visible { background-size: 100% 1px; outline: none; }
  .ig .ig-icon { width: 22px; height: 22px; transition: transform 0.45s ease; }
  .ig:hover .ig-icon { transform: rotate(-8deg) scale(1.06); }
  footer a { text-decoration: none; color: var(--ink); }
  footer a:hover { text-decoration: underline; text-underline-offset: 3px; }

  footer { text-align: center; color: var(--muted); padding: 0 16px 56px; font-size: 11px; }

  /* ---------- Lightbox theme ---------- */
  .lb {
    /* stays black in both modes, so the colors in the work stand out */
    --lb-bg: #0b0b0a;
    --lb-fg: #ece7df;
    --lb-muted: #a39d93;
    --lb-title-font: var(--serif);
    --lb-title-size: 25px;
    --lb-title-style: italic;
    --lb-meta-font: var(--sans);
    --lb-meta-size: 11.5px;
    --lb-meta-case: uppercase;
    --lb-meta-track: 0.22em;
  }

  @media (max-width: 640px) {
    body { font-size: 19px; }
    .masthead { padding-top: 32px; }
    .seal { width: 54px; margin-bottom: 14px; }
    .theme { top: 14px; right: 12px; padding: 7px 11px; font-size: 10px; }
    .nav .lg { display: none; }
    .nav { gap: 6px 20px; font-size: 12px; }
    .views { margin-top: 44px; }
    .frame img, .piece.tall .frame img, .piece:first-child .frame img { max-height: none; }
    .index { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 44px 18px; padding: 48px 16px 100px; }
    .cv-row { grid-template-columns: 1fr auto; }
    .cv-year { grid-column: 1 / -1; }
    .cv-row:not(.has-year) .cv-year { display: none; }
    .cv-row.has-year { padding-top: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html, body { transition: none; }
    [data-page] { animation: none; }
    .piece { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>
  <header class="masthead">
    <button class="theme" id="theme-btn" type="button">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <span id="theme-label">Night</span>
    </button>
    <a class="seal" href="#recent" aria-label="Marika Dunne, home"><span class="for-dark" data-fill="logo" data-light></span><span class="for-light" data-fill="logo"></span></a>
    <h1 class="name"><a href="#recent">Marika Dunne</a></h1>
    <nav class="nav" aria-label="Main">
      <a href="#recent" data-nav="recent">Recent<span class="lg"> Work</span></a>
      <a href="#past" data-nav="past">Past<span class="lg"> Work</span></a>
      <a href="#about" data-nav="about">About</a>
      <a href="#cv" data-nav="cv">CV</a>
      <a href="#contact" data-nav="contact">Contact</a>
    </nav>
  </header>

  <main>
    <section data-page="recent" aria-label="Recent Work">
      <div class="views" role="group" aria-label="Layout">
        <button type="button" data-view="wall" aria-pressed="true">Gallery</button>
        <button type="button" data-view="index" aria-pressed="false">Index</button>
      </div>
      <div class="wall" data-wall="recent"></div>
      <div class="index" data-index="recent" hidden></div>
      <a class="next" data-next="recent" href="#past"></a>
    </section>

    <section data-page="past" aria-label="Past Work" hidden>
      <div class="views" role="group" aria-label="Layout">
        <button type="button" data-view="wall" aria-pressed="true">Gallery</button>
        <button type="button" data-view="index" aria-pressed="false">Index</button>
      </div>
      <div class="wall" data-wall="past"></div>
      <div class="index" data-index="past" hidden></div>
      <a class="next" data-next="past" href="#recent"></a>
    </section>

    <section data-page="about" hidden>
      <div class="page">
        <figure class="portrait" data-fill="headshot"></figure>
        <span class="label">Biography</span>

  <footer>&copy; <span data-fill="year"></span> Marika Dunne &middot; All rights reserved<span data-optional> &middot; <a data-fill="ig-link" href="#">Instagram</a></span></footer>

<script>window.MD_BASE = ".";</script>
<!-- ?v= changes on every publish (publish.sh) so browsers load the new files right away -->
<script src="shared/content.js?v=20261020213229"></script>
<script src="shared/site.js?v=20261020213229"></script>
<script>
  // Recent Work opens with the featured piece (SITE.featured in content.js, Blank
  // Spaces); everything else keeps its date order. Moving it in the list itself
  // keeps the page, the Index, and the full-screen viewer in the same order.
  {
    const W = MD.WORKS, k = W.findIndex((w) => w.file === SITE.featured);
    if (k > 0 && W[k].collection === "recent") {
      const first = W.findIndex((w) => w.collection === "recent");
      W.splice(first, 0, W.splice(k, 1)[0]);
    }
  }

  // Each collection (Recent / Past) gets its own page, in both layouts
  document.querySelectorAll("[data-wall]").forEach((el) => {
    el.innerHTML = MD.byCollection(el.dataset.wall).map(({ w, i }) => `
      <figure class="piece${w.h > w.w * 1.05 ? " tall" : ""}">
        <button class="frame" type="button" data-open="${i}" data-scope="${w.collection}" aria-label="View ${MD.esc(w.title)} full screen">${MD.img(w, "full")}</button>
        <figcaption><span class="t">${MD.esc(w.title)}</span><span class="m">${MD.meta(w)}</span></figcaption>
      </figure>`).join("");
  });
  document.querySelectorAll("[data-index]").forEach((el) => {
    el.innerHTML = MD.byCollection(el.dataset.index).map(({ w, i }) => `
      <a class="cell" href="#${el.dataset.index}" data-open="${i}" data-scope="${w.collection}" aria-label="View ${MD.esc(w.title)} full screen">
        <span class="box">${MD.img(w, "thumb")}</span>
        <span class="t">${MD.esc(w.title)}</span>
        <span class="m">${MD.meta(w)}</span>
      </a>`).join("");
  });

  // Bottom of each collection: a card linking to the other one, with its cover
  document.querySelectorAll("[data-next]").forEach((el) => {
    const o = COLLECTIONS.find((c) => c.id !== el.dataset.next);
    const cover = MD.WORKS.find((w) => w.file === o.cover) || MD.byCollection(o.id)[0].w;
    el.href = "#" + o.id;
    el.innerHTML = `
      <span class="k">Continue viewing</span>
      <span class="cover" style="--focus:${o.coverFocus || "50% 50%"}">${MD.img(cover, "thumb", "cover-img")}</span>
      <span class="t">${MD.esc(o.title)}</span>
      <span class="m">${MD.byCollection(o.id).length} works<span class="arrow" aria-hidden="true">&rarr;</span></span>`;
  });

  document.getElementById("lead").textContent = STATEMENT[0];
  document.getElementById("statement").innerHTML = STATEMENT.slice(1).map((p) => `<p>${MD.esc(p)}</p>`).join("");
  MD.cv(document.getElementById("cv"));
  MD.fill();
  MD.router();
  MD.reveal(".piece");

  // Light / Dark switch (remembered per visitor)
  const themeBtn = document.getElementById("theme-btn");
  function showTheme() {
    const light = document.documentElement.dataset.theme === "light";
    document.getElementById("theme-label").textContent = light ? "Day" : "Night";
    themeBtn.setAttribute("aria-label", light ? "Day mode is on. Switch to night mode" : "Night mode is on. Switch to day mode");
  }
  themeBtn.addEventListener("click", () => {
    const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("md-theme", t); } catch (e) {}
    showTheme();
  });
  showTheme();

  // Gallery / Index switch (applies to both collections, remembered per visitor)
  const buttons = document.querySelectorAll("[data-view]");
  function setView(v) {
    document.querySelectorAll("[data-wall]").forEach((el) => (el.hidden = v !== "wall"));
    document.querySelectorAll("[data-index]").forEach((el) => (el.hidden = v !== "index"));
    buttons.forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === v));
    try { localStorage.setItem("md-f-view", v); } catch (e) {}
  }
  buttons.forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  try { const v = localStorage.getItem("md-f-view"); if (v) setView(v); } catch (e) {}
</script>
</body>
</html>
